<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Battery Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="font-family: Arial, sans-serif;">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light" style="transition: background-color 0.5s;">


        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Battery Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="order-history.html">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Admin Dashboard -->
    <div class="container my-5">
        <h2 class="text-center">Admin Dashboard</h2>

        <!-- Add Product Form -->
        <h4 class="mt-4">Add New Product</h4>
        <form onsubmit="addProduct(event)">
            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" id="product-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price ($)</label>
                <input type="number" id="product-price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input type="text" id="product-image" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Product</button>
        </form>

        <!-- Product List -->
        <h4 class="mt-4">Product List</h4>
        <div id="product-list" class="row">
            <!-- Products will be displayed here dynamically -->
        </div>
    </div>

    <!-- Footer -->
    <footer style="background-color: #f8f9fa; color: #343a40; text-align: center; padding: 15px; margin-top: 30px;">
        <p>&copy; 2024 Universal Battery Store | All Rights Reserved</p>
        <a href="privacy-policy.html" style="color: #343a40;">Privacy Policy</a>
    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Inline JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            displayProducts();
        });

        function addProduct(event) {
            event.preventDefault();
            const name = document.getElementById("product-name").value;
            const price = document.getElementById("product-price").value;
            const image = document.getElementById("product-image").value;

            let products = JSON.parse(localStorage.getItem("products")) || [];
            products.push({ name, price, image });
            localStorage.setItem("products", JSON.stringify(products));

            alert("Product added successfully!");
            displayProducts();
        }

        function displayProducts() {
            const productList = document.getElementById("product-list");
            let products = JSON.parse(localStorage.getItem("products")) || [];
            productList.innerHTML = "";

            products.forEach((product, index) => {
                productList.innerHTML += `
                    <div class="col-md-4">
                        <div style="border: 1px solid #ddd; border-radius: 5px; padding: 15px; text-align: center; margin-bottom: 20px;">
                            <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 150px; object-fit: cover;">
                            <h5 style="margin: 10px 0;">${product.name}</h5>
                            <p>Price: $${product.price}</p>
                            <button class="btn btn-danger" onclick="deleteProduct(${index})">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem("products")) || [];
            products.splice(index, 1);
            localStorage.setItem("products", JSON.stringify(products));
            displayProducts();
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Universal Battery Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-card { border: 1px solid #ddd; border-radius: 5px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .quantity-input { width: 60px; text-align: center; }
        #invoice { display: none; margin-top: 20px; border: 2px solid #000; padding: 15px; background: #f8f9fa; }
        #invoice table { width: 100%; border-collapse: collapse; }
        .navbar { background-color: #343a40; }
        .navbar-brand, .nav-link { color: #ffffff !important; }
        .summary { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body style="font-family: Arial, sans-serif;">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Battery Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="order-history.html">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Your Cart</h2>
        <input type="text" id="coupon-code" placeholder="Enter Coupon Code" class="form-control w-50 d-inline">
        <button class="btn btn-info" onclick="applyCoupon()">Apply Coupon</button>
        <div id="cart-items" class="row"></div>
        <div id="total-amount" class="summary"></div>
        <select id="payment-method" class="form-select w-50 mt-2">
            <option value="card">Credit/Debit Card</option>
            <option value="upi">UPI</option>
            <option value="cod">Cash on Delivery</option>
        </select>
        <button class="btn btn-success mt-3" onclick="placeOrder()">Place Order</button>
        <button class="btn btn-danger mt-3" onclick="clearCart()">Clear Cart</button>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function displayCartItems() {
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
                document.getElementById('total-amount').innerText = '';
                return;
            }
            cart.forEach(item => {
                cartItemsContainer.innerHTML += `
                    <div class="col-md-4">
                        <div class="product-card">
                            <img src="${item.image}" alt="${item.name}" style="width: 100%; height: 200px;">
                            <h5>${item.name}</h5>
                            <p>Price: $${item.price}</p>
                            <input type="number" value="${item.quantity || 1}" min="1" class="quantity-input" onchange="updateQuantity(${item.id}, this.value)">
                            <button class="btn btn-danger" onclick="removeFromCart(${item.id})">Remove</button>
                            <button class="btn btn-warning" onclick="saveForLater(${item.id})">Save for Later</button>
                        </div>
                    </div>`;
            });
            calculateTotal();
        }
        function updateQuantity(id, quantity) {
            let item = cart.find(i => i.id === id);
            if (item) {
                item.quantity = Math.max(1, parseInt(quantity) || 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                displayCartItems();
            }
        }
        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCartItems();
        }
        function saveForLater(id) {
            let item = cart.find(i => i.id === id);
            let saved = JSON.parse(localStorage.getItem('savedForLater')) || [];
            saved.push(item);
            localStorage.setItem('savedForLater', JSON.stringify(saved));
            removeFromCart(id);
        }
        function calculateTotal() {
            let total = cart.reduce((sum, i) => sum + (i.price * (i.quantity || 1)), 0);
            let discount = total > 100 ? total * 0.10 : 0;
            let shipping = total > 0 ? 5 : 0;
            let finalTotal = total - discount + shipping;
            document.getElementById('total-amount').innerText = `Subtotal: $${total.toFixed(2)} | Discount: $${discount.toFixed(2)} | Shipping: $${shipping} | Total: $${finalTotal.toFixed(2)}`;
        }
        function applyCoupon() {
            let code = document.getElementById('coupon-code').value;
            if (code === "SAVE10") {
                alert("Coupon applied! 10% off.");
                calculateTotal();
            } else {
                alert("Invalid Coupon Code");
            }
        }
        function placeOrder() {
            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }
            let paymentMethod = document.getElementById('payment-method').value;
            alert(`Order placed successfully! Payment via ${paymentMethod}`);
            localStorage.removeItem('cart');
            displayCartItems();
        }
        function clearCart() {
            localStorage.removeItem('cart');
            displayCartItems();
        }
        document.addEventListener('DOMContentLoaded', displayCartItems);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Battery Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }

        .btn-custom {
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.3s, transform 0.3s;
            background-color: #007bff;
            color: white;
        }

        .btn-custom:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .rating {
            color: gold;
        }

        .footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        .filter-section {
            margin-bottom: 30px;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #28a745;
            color: white;
            padding: 5px;
            border-radius: 5px;
        }

        .out-of-stock {
            background-color: #dc3545;
        }

        .quick-view-modal .modal-dialog {
            max-width: 800px;
        }

        .navbar-custom {
            background: linear-gradient(45deg, #007bff, #00c6ff);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #fff;
        }

        .navbar-custom .nav-link:hover {
            color: #d1ecf1;
        }

        .navbar-toggler {
            border: none;
            background: #fff;
        }

        .navbar-toggler-icon {
            background-image: url('data:image/svg+xml;charset=utf8,%3Csvg viewBox%3D%220 0 30 30%22 xmlns%3D%22http://www.w3.org/2000/svg%22%3E%3Cpath stroke%3D%22rgba%28255, 255, 255, 0.5%29%22 stroke-width%3D%222%22 linecap%3D%22round%22 linejoin%3D%22round%22 d%3D%22M4 7h22M4 15h22M4 23h22%22/%3E%3C/svg%3E');
        }

        .dropdown-menu {
            background-color: #007bff;
            border: none;
        }

        .dropdown-item {
            color: #fff;
        }

        .dropdown-item:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif;">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Battery Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">Cart</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="wishlist.html">Wishlist</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="order-history.html">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact Us</a>
                    </li>
                </ul>
                <div class="ms-auto d-none d-lg-block">
                    <button class="btn btn-outline-light" onclick="showCartPreview()">Cart Preview</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Filter Section -->
    <div class="container my-4 filter-section">
        <h2 class="text-center">Our Battery Collection</h2>
        <div class="d-flex justify-content-center">
            <input type="text" id="search" class="form-control w-50 search-bar" placeholder="Search for batteries..." onkeyup="searchProducts()">
        </div>
        <div class="d-flex justify-content-center">
            <select id="filter" class="form-select w-50" onchange="filterProducts()">
                <option value="all">All Batteries</option>
                <option value="car">Car Battery</option>
                <option value="aa">AA Battery</option>
                <option value="laptop">Laptop Battery</option>
                <option value="mobile">Mobile Battery</option>
                <option value="solar">Solar Battery</option>
                <option value="motorcycle">motorcycle Battery</option>
            </select>
        </div>
        <div class="d-flex justify-content-center">
            <select id="sort" class="form-select w-50 mt-3" onchange="sortProducts()">
                <option value="default">Sort by</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="rating-desc">Rating: High to Low</option>
            </select>
        </div>
    </div>

    <!-- Product List -->
    <div class="container">
        <div id="product-list" class="row">
            <!-- Products will be displayed here dynamically -->
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Universal Battery Store | All Rights Reserved</p>
    </footer>

    <!-- Quick View Modal -->
    <div class="modal fade quick-view-modal" id="quickViewModal" tabindex="-1" aria-labelledby="quickViewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="quickViewModalLabel">Quick View</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="quick-view-content">
                        <!-- Quick view content will be loaded here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Car Battery A", price: 120, image: "images/exideall.jpeg", type: "car", rating: 4.5, description: "High performance car battery.", stock: 10 },
            { id: 2, name: "Car BatteryB ", price: 120, image: "images/power battery.jpg", type: "car", rating: 4.5, description: "High performance car battery.", stock: 10 },
            { id: 3, name: "Car Battery C", price: 140, image: "images/exideall.jpeg", type: "car", rating: 4.0, description: "Reliable and durable.", stock: 0 },
            { id: 4, name: "Car Battery D", price: 140, image: "images/car battery.jpg", type: "car", rating: 4.0, description: "Reliable and durable.", stock: 0 },
            { id: 5, name: "Car Battery E", price: 150, image: "images/Energy.jpg", type: "car", rating: 4.0, description: "Reliable and durable.", stock: 0 },
            { id: 6, name: "Car Battery F", price: 150, image: "images/bosch battery.jpg", type: "car", rating: 4.0, description: "Reliable and durable.", stock: 0 },
            { id: 7, name: "Car Battery G", price: 2000, image: "images/Amaron Battery.jpeg", type: "car", rating: 4.0, description: "Reliable and durable.", stock: 0 },
            { id: 8, name: "Motorcycle Battery", price: 2000, image: "images/exide motocycle.jpg", type: "motorcycle", rating: 4.0, description: "Reliable and durable.", stock: 0 },
            { id: 9, name: "Motorcycle Battery", price: 2000, image: "images/motocycle battery.jpg", type: "motorcycle", rating: 4.0, description: "Reliable and durable.", stock: 0 },
            { id: 10, name: "AA Battery A", price: 10, image: "images/IMG1.jpg", type: "aa", rating: 4.8, description: "Long-lasting AA battery.", stock: 50 },
            { id: 11, name: "AA Battery A", price: 10, image: "images/AA image.jpg", type: "aa", rating: 4.8, description: "Long-lasting AA battery.", stock: 50 },
            { id: 12, name: "AA Battery B", price: 15, image: "images/IMG2.jpg", type: "aa", rating: 4.6, description: "Excellent performance.", stock: 30 },
            { id: 13, name: "Laptop Battery A", price: 200, image: "images/IMG%203.jpg", type: "laptop", rating: 4.7, description: "High-capacity laptop battery.", stock: 5 },
            { id: 14, name: "Laptop Battery B", price: 220, image: "images/IMG4.jpg", type: "laptop", rating: 4.5, description: "Reliable laptop battery.", stock: 8 },
            { id: 15, name: "Mobile Battery A", price: 50, image: "images/mobile battery.jpg", type: "mobile", rating: 4.3, description: "Compact mobile battery.", stock: 20 },
            { id: 16, name: "Mobile Battery B", price: 60, image: "images/mobile2.jpg", type: "mobile", rating: 4.4, description: "High-performance mobile battery.", stock: 0 },
            { id: 17, name: "Solar Battery A", price: 300, image: "images/pexels-moh-adbelghaffar-1084213.jpg", type: "solar", rating: 4.9, description: "Eco-friendly solar battery.", stock: 3 },
            { id: 18, name: "Solar Battery B", price: 320, image: "images/pexels-scgough-7019805.jpg", type: "solar", rating: 4.8, description: "Efficient solar battery.", stock: 1 },
            { id: 19, name: "Car Battery C", price: 150, image: "images/exideall.jpeg", type: "car", rating: 4.2, description: "Affordable car battery.", stock: 12 },
            { id: 20, name: "Power Bank", price: 80, image: "images/pexels-scgough-7019805.jpg", type: "power-bank", rating: 4.7, description: "Portable power bank for all devices.", stock: 15 },
        ];

        function displayProducts(filter = "all", searchQuery = "", sort = "default") {
            const productList = document.getElementById("product-list");
            productList.innerHTML = "";

            let filteredProducts = filter === "all" ? products : products.filter(p => p.type === filter);
            if (searchQuery !== "") {
                filteredProducts = filteredProducts.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            if (sort === "price-asc") {
                filteredProducts.sort((a, b) => a.price - b.price);
            } else if (sort === "price-desc") {
                filteredProducts.sort((a, b) => b.price - a.price);
            } else if (sort === "rating-desc") {
                filteredProducts.sort((a, b) => b.rating - a.rating);
            }

            filteredProducts.forEach(product => {
                productList.innerHTML += `
                    <div class="col-md-3">
                        <div class="product-card position-relative">
                            <img src="${product.image}" alt="${product.name}" class="product-image" onclick="showQuickView(${product.id})" style="cursor:pointer;">
                            ${product.stock > 0 ? `<span class="stock-badge">In Stock</span>` : `<span class="stock-badge out-of-stock">Out of Stock</span>`}
                            <h5 style="margin: 10px 0;">${product.name}</h5>
                            <p>Price: $${product.price}</p>
                            <p class="rating">Rating: ${'★'.repeat(Math.floor(product.rating))}${'☆'.repeat(5 - Math.floor(product.rating))}</p>
                            <p>${product.description}</p>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-success btn-sm" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>Add to Cart</button>
                                <button class="btn btn-info btn-sm" onclick="addToWishlist(${product.id})">Add to Wishlist</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const filterValue = document.getElementById("filter").value;
            const searchQuery = document.getElementById("search").value;
            const sortValue = document.getElementById("sort").value;
            displayProducts(filterValue, searchQuery, sortValue);
        }

        function searchProducts() {
            const searchQuery = document.getElementById("search").value;
            const filterValue = document.getElementById("filter").value;
            const sortValue = document.getElementById("sort").value;
            displayProducts(filterValue, searchQuery, sortValue);
        }

        function sortProducts() {
            const sortValue = document.getElementById("sort").value;
            const filterValue = document.getElementById("filter").value;
            const searchQuery = document.getElementById("search").value;
            displayProducts(filterValue, searchQuery, sortValue);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push(product);
            localStorage.setItem("cart", JSON.stringify(cart));
            alert(`${product.name} added to cart!`);
        }

        function addToWishlist(productId) {
            const product = products.find(p => p.id === productId);
            let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
            wishlist.push(product);
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
            alert(`${product.name} added to wishlist!`);
        }

        function showQuickView(productId) {
            const product = products.find(p => p.id === productId);
            const quickViewContent = document.getElementById("quick-view-content");
            quickViewContent.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <img src="${product.image}" alt="${product.name}" class="w-100">
                    </div>
                    <div class="col-md-6">
                        <h5>${product.name}</h5>
                        <p>Price: $${product.price}</p>
                        <p class="rating">Rating: ${'★'.repeat(Math.floor(product.rating))}${'☆'.repeat(5 - Math.floor(product.rating))}</p>
                        <p>${product.description}</p>
                        <p>Stock: ${product.stock > 0 ? product.stock : "Out of Stock"}</p>
                        <button class="btn btn-success btn-sm" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>Add to Cart</button>
                        <button class="btn btn-info btn-sm" onclick="addToWishlist(${product.id})">Add to Wishlist</button>
                    </div>
                </div>
            `;
            new bootstrap.Modal(document.getElementById('quickViewModal')).show();
        }

        function showCartPreview() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const cartPreview = cart.map(product => `<p>${product.name} - $${product.price}</p>`).join("");
            alert(cartPreview || "Your cart is empty!");
        }

        document.addEventListener("DOMContentLoaded", () => {
            displayProducts();
        });
    </script>
</body>

</html>

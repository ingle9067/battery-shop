<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Universal Battery Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
        }

        .navbar-nav .nav-link {
            margin-right: 15px;
        }

        .navbar-nav .nav-link.active {
            font-weight: bold;
            color: #0d6efd;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            transition: box-shadow 0.3s ease;
        }

        .product-card:hover {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .product-card h5 {
            margin: 10px 0;
        }

        .footer {
            background-color: #f8f9fa;
            color: #343a40;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        .footer p {
            margin: 0;
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif;">

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Battery Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link active" href="wishlist.html">Wishlist</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Product</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="order-history.html">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Your Wishlist</h2>
        <div id="wishlist-items" class="row">
            <!-- Wishlist items will be displayed here -->
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Universal Battery Store | All Rights Reserved</p>
    </footer>

    <script>
        // Retrieve wishlist items from local storage
        const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

        function removeFromWishlist(productId) {
            const index = wishlist.findIndex(item => item.id === productId);
            if (index > -1) {
                wishlist.splice(index, 1); // Remove product from the wishlist
                localStorage.setItem('wishlist', JSON.stringify(wishlist)); // Update local storage
                displayWishlistItems(); // Refresh the displayed wishlist
            }
        }

        function displayWishlistItems() {
            const wishlistItemsContainer = document.getElementById('wishlist-items');
            wishlistItemsContainer.innerHTML = '';

            if (wishlist.length === 0) {
                wishlistItemsContainer.innerHTML = '<p>Your wishlist is empty.</p>';
                return;
            }

            wishlist.forEach(item => {
                wishlistItemsContainer.innerHTML += `
                    <div class="col-md-4">
                        <div class="product-card">
                            <img src="${item.image}" alt="${item.name}">
                            <h5>${item.name}</h5>
                            <p>Price: $${item.price}</p>
                            <button class="btn btn-danger" onclick="removeFromWishlist(${item.id})">Remove</button>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', displayWishlistItems);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
